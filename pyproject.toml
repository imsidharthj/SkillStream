[project]
name = "skillstream"
version = "0.1.0"
description = "AI Interviewer — modular voice/chat interview automation"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[groq,elevenlabs,silero,langchain,liveavatar]~=1.8",
    "livekit-api>=1.0",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langgraph>=1.0",
    "fastapi[standard]>=0.115",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
